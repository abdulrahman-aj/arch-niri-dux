# Package-owned Avahi configuration, selected by an avahi-daemon.service drop-in.
# Avahi only queries: browsing and .local resolution keep working, while the
# host publishes no address, hostname or service records.
[server]
use-ipv4=yes
use-ipv6=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[publish]
disable-publishing=yes
