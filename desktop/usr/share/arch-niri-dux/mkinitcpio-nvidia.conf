# Early KMS for the NVIDIA driver. apply-nvidia links this file as
# /etc/mkinitcpio.conf.d/nvidia.conf, which sorts after arch-niri-dux.conf;
# that file assigns MODULES, so an earlier-sorting name would be overwritten.
MODULES+=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)

# The driver does its own modesetting, so kms only adds nouveau and about
# 100 MB of firmware for a driver nvidia-utils blacklists. Drop kms only when
# every display controller is NVIDIA. A hybrid machine's iGPU needs it for the
# unlock prompt; so does an unreadable PCI tree or a machine without its card.
# Same rule as Omarchy's omarchy_hooks.conf.
_and_nvidia_gpu=0
_and_other_gpu=0
for _and_pci in "${ARCH_NIRI_DUX_PCI_DEVICES:-/sys/bus/pci/devices}"/*; do
    if [[ ! -r $_and_pci/class || ! -r $_and_pci/vendor ]]; then
        _and_other_gpu=1
        continue
    fi
    [[ $(<"$_and_pci/class") == 0x03* ]] || continue
    if [[ $(<"$_and_pci/vendor") == 0x10de ]]; then
        _and_nvidia_gpu=1
    else
        _and_other_gpu=1
    fi
done
if ((_and_nvidia_gpu && !_and_other_gpu)); then
    _and_hooks=()
    for _and_hook in "${HOOKS[@]}"; do
        [[ $_and_hook == kms ]] || _and_hooks+=("$_and_hook")
    done
    HOOKS=("${_and_hooks[@]}")
fi
unset _and_nvidia_gpu _and_other_gpu _and_pci _and_hooks _and_hook
