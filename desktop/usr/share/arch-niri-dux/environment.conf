QT_QPA_PLATFORM=wayland;xcb
QT_QPA_PLATFORMTHEME=gtk3
QT_QPA_PLATFORMTHEME_QT6=gtk3
TERMINAL=alacritty
# Session-wide ~/.local/bin for systemd user services. Appended, so system
# binaries keep precedence; preserves the existing PATH (including Nix
# profiles). Login shells use /etc/profile.d/dux-localbin.sh (fish:
# vendor_conf.d); Niri spawns inherit from dux-niri-session, which carries
# the same rule. environment.d alone cannot reach the compositor: greetd
# launches Niri directly, not as a systemd user service.
PATH=${PATH:+$PATH:}${HOME}/.local/bin
