name: Integration packages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['integration-v*']

permissions:
  contents: read

concurrency:
  group: integration-${{ startsWith(github.ref, 'refs/tags/integration-v') && 'release' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/integration-v') }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: make test

  packages:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:767de6eaa40dcfeda5263a48737ea03a782caabdf3a403b6e6a203c7fd333681
    steps:
      - run: pacman -Syu --noconfirm --needed python git
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build without signing credentials
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/package-work" "$RUNNER_TEMP/packages"
          chown nobody:nobody "$RUNNER_TEMP/package-work" "$RUNNER_TEMP/packages"
          epoch=$(git -c safe.directory="$GITHUB_WORKSPACE" log -1 --format=%ct)
          runuser -u nobody -- python scripts/build-integration.py "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/package-work" "$RUNNER_TEMP/packages" --epoch "$epoch"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: integration-${{ github.sha }}
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/integration-v')
    needs: [checks, packages]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:767de6eaa40dcfeda5263a48737ea03a782caabdf3a403b6e6a203c7fd333681
    environment: integration-release
    permissions:
      contents: write
    env:
      GNUPGHOME: ${{ runner.temp }}/integration-keyring
    steps:
      - run: pacman -Syu --noconfirm --needed python git github-cli jq gnupg
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: integration-${{ github.sha }}
          path: ${{ runner.temp }}/packages
      - name: Sign and publish this deliberate release
        shell: bash
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$PACKAGE_SIGNING_KEY" | gpg --batch --import
          unset PACKAGE_SIGNING_KEY
          bash scripts/publish-integration "$GITHUB_WORKSPACE" "$RUNNER_TEMP/packages" \
            "$RUNNER_TEMP/history" "$RUNNER_TEMP/site/x86_64"
      - name: Remove private signing material
        if: always()
        shell: bash
        run: |
          gpgconf --kill all || true
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: startsWith(github.ref, 'refs/tags/integration-v')
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
